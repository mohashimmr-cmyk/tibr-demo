*{box-sizing:border-box}

body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;direction:rtl}

button,input,select,textarea{font:inherit;color:inherit}

.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:22px}
h3{font-size:15px;margin:0 0 10px;font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.logo{display:flex;align-items:center;gap:12px}
.mark{width:46px;height:46px;border-radius:12px;background:var(--or);color:#111;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:24px}
.logo h1{font-size:30px}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}

.nav{display:grid;gap:2px}

.main{min-width:0}

const exp=p=>p.t*p.g*p.r/100/1000;
function pstat(p){const e=exp(p),g=(e-p.d)/e;return g>.08?["bad","فرق مرتفع"]:g>.03?["warn","مراجعة"]:["ok","مطابق"]}
const vExp=v=>Math.max(v.t,v.cy/CY_PER_T)*VAT_GRADE*VAT_REC;
function vstat(v){const e=vExp(v),g=(e-v.sold)/e;return g>.35?["bad","بيع أقل بكثير"]:g>.15?["warn","مراجعة"]:["ok","متسق"]}
function kflag(k){if(!k.lic)return"المصدر غير مرخّص";if(k.hg==="مرتفع"&&k.g>5)return"العيار أعلى بكثير من متوسط الموقع ونسبة زئبق مرتفعة";return""}
function shareDue(){return S.plants.reduce((a,p)=>a+p.d*RATE,0)}
function shareIn(){return S.bars.filter(b=>b.share&&b.status==="مستلم في البنك").reduce((a,b)=>a+b.kg,0)}
function shareMade(){return S.bars.filter(b=>b.share).reduce((a,b)=>a+b.kg,0)}
function artSold(){return S.vats.reduce((a,v)=>a+v.sold,0)/1000}
function artExp(){return S.vats.reduce((a,v)=>a+vExp(v),0)/1000}
function addCase(key,title,level,entity,reason,action){
 if(S.cases.some(c=>c.key===key&&c.status!=="مغلقة"))return;
 S.cases.unshift({id:"CS-"+(++S.seq.case),key,title,level,entity,reason,action,status:"مفتوحة",assignee:"",created:now(),notes:[]});
}

 S.plants.forEach(p=>{const[k]=pstat(p);if(k!=="ok")addCase("plant-"+p.id,`${p.n}: المُعلن أقل من المتوقَّع بـ ${f((exp(p)-p.d)/exp(p)*100)}%`,k,p.n,p.c>0?"استهلاك السيانيد يتسق مع معالجة كامل الخام":"وزن المركّز عند البوابة أعلى من المُعلن",k==="bad"?"تفتيش ميداني خلال 72 ساعة وتعليق تصاريح الترحيل":"طلب تبرير من الشركة خلال 7 أيام")});
 S.karta.forEach(k=>{const fl=kflag(k);if(fl&&k.v!=="مقبولة")addCase("karta-"+k.id,`شحنة كرتة ${k.id}: ${fl}`,"bad",k.src,"احتمال تمرير ذهب أهلي غير مسجّل عبر مصنع الكرتة","حجز الشحنة وزيارة المصدر")});
 S.vats.forEach(v=>{const[k]=vstat(v);if(k!=="ok")addCase("vat-"+v.id,`${v.n}: المُباع أقل من المتوقَّع`,k,v.n,"كمية السيانيد المصروفة تشير لمعالجة أكبر مما بيع","زيارة الموقع ومراجعة سجل البيع")});
 S.sites.forEach(s=>{if(!s.lic&&s.p===1&&!s.visited)addCase("site-"+s.id,`رصد فضائي: ${s.n} غير مرخّص`,"warn",s.n,"ظهر في صورة أكتوبر ولم يكن في صورة سبتمبر","إرسال فريق تسجيل ميداني");if(s.risk)addCase("risk-"+s.id,`خطر سلامة: ${s.n}`,"bad",s.n,s.note,"إيقاف العمل في البئر وتوعية المُعدِّنين")});
 save();
}
